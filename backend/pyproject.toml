[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visionrag-backend"
version = "0.1.0"
description = "VisionRAG FastAPI backend — CLIP + Qdrant + Gemini"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",  # Required for FastAPI multipart/form-data file uploads

    # Data validation & environment settings
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Vector database client (supports local embedded on-disk mode)
    "qdrant-client>=1.9.0",

    # Multimodal CLIP embeddings (Hugging Face Transformers)
    # PyTorch is installed separately to select CPU vs CUDA build explicitly:
    # CPU: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
    "transformers>=4.40.0",
    "Pillow>=10.0.0",

    # Gemini LLM API client for RAG explanations
    "google-generativeai>=0.7.0",

    # Progress bar and utilities
    "tqdm>=4.66.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
