services:
  - type: web
    name: visionrag
    env: python
    buildCommand: |
      cd frontend && npm install && npm run build && cd .. && pip install --no-cache-dir -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
