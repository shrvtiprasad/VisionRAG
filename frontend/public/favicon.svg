<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Soft optical blur filter for outer bokeh elements -->
    <filter id="outer-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" />
    </filter>
    
    <!-- Medium blur for extreme outer ring -->
    <filter id="halo-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.0" />
    </filter>

    <!-- Center core glow -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </radialGradient>
  </defs>

  <!-- Dark charcoal container -->
  <rect width="32" height="32" rx="8" fill="#0b0f19" />

  <!-- Multi-ring Lens Blur with outer blur & greyish-indigo color decay -->
  <!-- Center Crisp Focal Core -->
  <circle cx="16" cy="16" r="3.4" fill="url(#center-glow)" />

  <!-- Inner Ring (Clear Indigo, r=7.5) -->
  <g fill="#93c5fd" opacity="0.95">
    <circle cx="23.5" cy="16" r="2.0" />
    <circle cx="19.75" cy="22.5" r="2.0" />
    <circle cx="12.25" cy="22.5" r="2.0" />
    <circle cx="8.5" cy="16" r="2.0" />
    <circle cx="12.25" cy="9.5" r="2.0" />
    <circle cx="19.75" cy="9.5" r="2.0" />
  </g>

  <!-- Middle Ring (Muted Slate-Greyish Blue with light soft blur, r=12.5) -->
  <g fill="#94a3b8" opacity="0.85" filter="url(#outer-blur)">
    <circle cx="28.5" cy="16" r="1.7" />
    <circle cx="26.83" cy="22.25" r="1.7" />
    <circle cx="22.25" cy="26.83" r="1.7" />
    <circle cx="16" cy="28.5" r="1.7" />
    <circle cx="9.75" cy="26.83" r="1.7" />
    <circle cx="5.17" cy="22.25" r="1.7" />
    <circle cx="3.5" cy="16" r="1.7" />
    <circle cx="5.17" cy="9.75" r="1.7" />
    <circle cx="9.75" cy="5.17" r="1.7" />
    <circle cx="16" cy="3.5" r="1.7" />
    <circle cx="22.25" cy="5.17" r="1.7" />
    <circle cx="26.83" cy="9.75" r="1.7" />
  </g>

  <!-- Outer Ring (Greyish Slate with halo blur & depth decay, r=14.5) -->
  <g fill="#64748b" opacity="0.65" filter="url(#halo-blur)">
    <circle cx="29.39" cy="21.55" r="1.4" />
    <circle cx="21.55" cy="29.39" r="1.4" />
    <circle cx="10.45" cy="29.39" r="1.4" />
    <circle cx="2.61" cy="21.55" r="1.4" />
    <circle cx="2.61" cy="10.45" r="1.4" />
    <circle cx="10.45" cy="2.61" r="1.4" />
    <circle cx="21.55" cy="2.61" r="1.4" />
    <circle cx="29.39" cy="10.45" r="1.4" />
  </g>
</svg>
